name: Laminas

on:
  push:
    branches:
      - '*.x'
  pull_request:

jobs:
  latest:
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
    uses: ./.github/workflows/integration.yml
    with:
      php: ${{ matrix.php }}
      suite: Laminas
      package: laminas/laminas-diactoros
